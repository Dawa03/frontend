<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <script src="scripts/config.js"></script>
  <script src="scripts/register.js"></script>
</head>
<body>
  <nav>
    <a href="index.html">All Songs</a>
    <a href="add_song.html">Add Songs</a>
    <a href="register.html">Register</a>
    <a href="login.html">Login</a>
  </nav>

  <h1>Create Account</h1>
  <form>
    <div>
      <label for="username">Username:</label>
      <input type="text" id="username" required>
    </div>
    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" required>
    </div>
    <div>
      <label for="status">Status:</label>
      <input type="text" id="status" value="active">
    </div>
    <input type="button" id="registerBtn" value="Register">
    <p id="message"></p>
    <p>Already registered? <a href="login.html">Log in here</a>.</p>
  </form>
</body>
</html>
